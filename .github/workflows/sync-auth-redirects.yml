name: Sync Auth Redirect URLs

# Keeps Supabase Auth redirect allow-list aligned with Vercel domains.
# Google OAuth still only needs the single Supabase callback URI.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/auth-redirects.baseline.json"
      - "scripts/sync-auth-redirects.mjs"
      - ".github/workflows/sync-auth-redirects.yml"
  schedule:
    # Catch custom domains added in the Vercel dashboard.
    - cron: "0 */12 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync Supabase redirect URLs from Vercel domains
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: nxgpwlcxakcoknbvujym
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_vTX0pIZr1ep0BCZM62wWBwzvfjkI
          VERCEL_TEAM_ID: team_AItGytlCF6V5JpOq4y0w1Edb
          SITE_URL: https://redsssproduction-studios.vercel.app
        run: node scripts/sync-auth-redirects.mjs
